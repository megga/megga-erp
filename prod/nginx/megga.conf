# Reverse proxy TLS devant Odoo. Le certificat est monte depuis ./certs
# (Let's Encrypt en production, auto-signe pour un essai local).
upstream odoo      { server erp:8069; }
upstream odoo_long { server erp:8072; }   # longpolling / websocket (chat, notifications)

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Pieces jointes et imports de fichiers camt
    client_max_body_size 100M;
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Le gestionnaire de bases n'est jamais joignable depuis l'exterieur,
    # meme si list_db etait reactive par erreur.
    location ~* ^/web/database/(manager|selector|create|duplicate|drop|backup|restore) {
        return 404;
    }

    location /websocket {
        proxy_pass http://odoo_long;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://odoo;
        proxy_redirect off;
    }

    # Cache des assets statiques (avec cache-busting Odoo par URL)
    location ~* /web/static/ {
        proxy_cache_valid 200 3d;
        proxy_pass http://odoo;
        expires 3d;
    }

    gzip on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
}
