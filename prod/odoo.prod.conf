[options]
addons_path = /opt/addons,/opt/addons/verticals/dental,/opt/addons/verticals/resto,/opt/addons/verticals/auto,/opt/addons/verticals/care,/opt/addons-oca,/opt/odoo/addons,/opt/odoo/odoo/addons
data_dir = /var/lib/odoo

db_host = db
db_port = 5432
db_user = odoo
; db_password et admin_passwd sont injectes depuis .env au demarrage
; (entrypoint) — jamais ecrits en clair dans ce fichier versionne.

; --- Exposition ---
; Odoo n'ecoute que sur le reseau interne : seul nginx est publie.
http_interface = 0.0.0.0
proxy_mode = True

; --- Verrouillage de la base ---
; Une seule base, jamais listable : neutralise le gestionnaire de bases
; et l'enumeration des bases par un visiteur.
list_db = False

; --- Multi-processus ---
; workers > 0 impose le mode prefork : indispensable au-dela d'un utilisateur.
workers = 5
max_cron_threads = 2
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560
limit_request = 8192

; --- Journalisation ---
log_level = info
logfile = None
